name: Claude review

# Fresh-context Claude review of every PR from this repo (not forks), on the owner's Claude subscription.
# Inert until the repo secret CLAUDE_CODE_OAUTH_TOKEN exists (create it with `claude setup-token`).
# Reviews only: it comments, never approves, pushes or merges. CI (the existing workflow) stays the merge gate.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip (no CLAUDE_CODE_OAUTH_TOKEN secret yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "Add the CLAUDE_CODE_OAUTH_TOKEN repo secret to enable Claude review."

      - uses: actions/checkout@v6
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a reviewer with no context beyond this PR and the repo. Review the diff for problems that matter:
            correctness bugs, security (auth, input validation, secrets, injection), data loss, broken migrations,
            and missing tests for changed behaviour. Read CLAUDE.md / AGENTS.md first and hold the PR to their rules.
            Skip style nits and praise. Use inline comments for specific lines, and one short summary comment that
            ends with a verdict: "No blocking issues" or "Blocking: <n> issue(s)". Never approve, push or merge.
          claude_args: |
            --model sonnet --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
