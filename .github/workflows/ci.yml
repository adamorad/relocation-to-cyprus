name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build (static export and Pagefind index)
        id: build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_GA_ID: G-B0LWNF9WEG
          NEXT_PUBLIC_META_PIXEL_ID: 1973755576021251
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      - name: Internal link check
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm qa:links
      - name: House rules
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm qa:rules
      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2 A and AA)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm qa:axe
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa-reports/
          if-no-files-found: ignore
